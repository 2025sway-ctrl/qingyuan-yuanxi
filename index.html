<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>青玉案·元夕 — 宋韵上元灯会</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/ma-shan-zheng@5/index.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/noto-serif-sc@5/400.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/noto-serif-sc@5/600.css">
<style>
:root{
  --gold:#ecc67f;--gold2:#c8954a;--red:#9b2216;--red2:#5c0f09;
  --fcal:"Ma Shan Zheng","STXingkai","华文行楷","STKaiti","KaiTi","楷体","Kaiti SC",serif;
  --fser:"Noto Serif SC","Songti SC","STSong","SimSun","宋体",serif;
}
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#050407}
body{font-family:var(--fser);color:#f7e6bf;-webkit-font-smoothing:antialiased;user-select:none}
button{font-family:inherit;cursor:pointer;color:inherit}
#stage{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);overflow:hidden;overflow:clip;background:#07060c;box-shadow:0 0 80px rgba(0,0,0,.85)}
#c{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none;outline:none}
#ui{position:absolute;left:0;top:0;width:1920px;height:1080px;transform-origin:0 0;pointer-events:none;overflow:clip}
.ia{pointer-events:auto}
.vignette{position:absolute;inset:0;background:
  radial-gradient(ellipse at 60% 52%,transparent 55%,rgba(5,2,4,.55) 100%),
  linear-gradient(180deg,rgba(10,4,6,.35),transparent 12%,transparent 84%,rgba(10,4,4,.55))}

/* ---------- 顶栏 ---------- */
.topbar{position:absolute;left:0;top:0;width:1920px;height:96px;display:flex;align-items:center;padding:0 48px;
  background:linear-gradient(180deg,rgba(30,8,6,.94),rgba(30,8,6,.6) 70%,rgba(30,8,6,0));}
.topbar::after{content:"";position:absolute;left:40px;right:40px;bottom:10px;height:1px;background:linear-gradient(90deg,transparent,rgba(236,198,127,.45),transparent)}
.logo{flex:none;white-space:nowrap;display:flex;align-items:center;gap:12px;cursor:pointer}
.logo .lt{font-family:var(--fcal);font-size:46px;color:var(--gold);text-shadow:0 0 18px rgba(255,170,70,.5);letter-spacing:2px}
.seal{display:inline-grid;place-items:center;background:#b3261a;color:#fbe3c0;font-family:var(--fcal);border-radius:4px;
  box-shadow:inset 0 0 0 2px rgba(255,220,180,.4),0 0 10px rgba(180,30,10,.5)}
.logo .seal{width:30px;height:50px;font-size:18px;writing-mode:vertical-rl;letter-spacing:2px}
.nav{flex:none;display:flex;gap:10px;margin-left:150px;white-space:nowrap}
.nav a{position:relative;padding:10px 30px;font-size:24px;letter-spacing:3px;color:#f3dcae;border-radius:8px;cursor:pointer;transition:.25s;border:1px solid transparent}
.nav a:hover{color:#fff3d2;background:rgba(180,40,20,.28)}
.nav a.on{background:linear-gradient(180deg,#b9321e,#7a150c);border-color:rgba(236,198,127,.8);box-shadow:0 0 18px rgba(255,120,40,.4),inset 0 1px 0 rgba(255,220,170,.45);color:#fff0c8}
.search{flex:none;margin-left:auto;display:flex;align-items:center;width:330px;height:48px;border:1.5px solid rgba(236,198,127,.6);border-radius:24px;background:rgba(30,10,8,.6);padding:0 18px;gap:10px}
.search input{flex:1;min-width:0;background:none;border:0;outline:0;color:#f7e6bf;font-size:19px;font-family:inherit}
.search input::placeholder{color:rgba(247,230,191,.5)}
.search svg{flex:none;cursor:pointer}
.icon-btn{flex:none;width:48px;height:48px;margin-left:18px;border-radius:50%;border:1.5px solid rgba(236,198,127,.55);background:rgba(30,10,8,.6);display:grid;place-items:center;position:relative;color:var(--gold);transition:.2s}
.icon-btn:hover{background:rgba(160,40,20,.55)}
.icon-btn .dot{position:absolute;right:9px;top:9px;width:9px;height:9px;border-radius:50%;background:#ff5a3a;box-shadow:0 0 8px #ff5a3a}

/* ---------- 左侧面板 ---------- */
.side{position:absolute;left:40px;top:116px;width:420px;height:924px;padding:40px 40px 30px;border-radius:16px;
  background:radial-gradient(circle at 15% 0,rgba(255,160,70,.16),transparent 45%),linear-gradient(180deg,rgba(62,15,10,.88),rgba(26,7,5,.84));
  border:1.5px solid rgba(236,198,127,.6);
  box-shadow:inset 0 0 0 7px rgba(20,5,3,.55),inset 0 0 0 8.5px rgba(236,198,127,.32),0 20px 60px rgba(0,0,0,.55)}
.corner{position:absolute;width:34px;height:34px;border:2px solid var(--gold);opacity:.85}
.corner.tl{left:16px;top:16px;border-right:0;border-bottom:0;border-radius:8px 0 0 0}
.corner.tr{right:16px;top:16px;border-left:0;border-bottom:0;border-radius:0 8px 0 0}
.corner.bl{left:16px;bottom:16px;border-right:0;border-top:0;border-radius:0 0 0 8px}
.corner.br{right:16px;bottom:16px;border-left:0;border-top:0;border-radius:0 0 8px 0}
.title{margin:4px 0 0;font-family:var(--fcal);font-weight:400;line-height:1.0;position:relative}
.title .tx{display:block;white-space:nowrap;background:linear-gradient(180deg,#fff6d6 8%,#f3c86e 55%,#c27c2c);-webkit-background-clip:text;background-clip:text;color:transparent;
  filter:drop-shadow(0 0 14px rgba(255,170,60,.45)) drop-shadow(0 3px 0 rgba(60,10,4,.85))}
.title .t1{font-size:100px;letter-spacing:0}
.title .t2{font-size:98px;margin-left:86px}
.title .seal{position:absolute;right:-14px;top:14px;width:40px;height:92px;font-size:21px;writing-mode:vertical-rl;letter-spacing:5px}
.poem{margin:22px 0 0;font-family:var(--fcal);font-size:31px;line-height:1.55;color:#f6e2b6;letter-spacing:3px}
.poem p{margin:0}
.poem .by{font-family:var(--fser);font-size:18px;color:rgba(246,226,182,.68);text-align:right;letter-spacing:1px;margin-top:8px}
.menu{margin-top:30px}
.opt{display:flex;align-items:center;width:340px;height:76px;margin:0 0 18px;padding:0 24px 0 12px;border-radius:40px;border:2px solid #dcb066;
  background:linear-gradient(180deg,#a8291c,#6a130c);color:#fde6b0;font-size:32px;letter-spacing:6px;font-family:var(--fcal);
  box-shadow:0 0 0 4px rgba(70,14,8,.65),inset 0 2px 0 rgba(255,220,160,.35),0 8px 24px rgba(0,0,0,.4);transition:transform .25s,box-shadow .25s,background .25s}
.opt i{width:54px;height:54px;flex:none;border-radius:50%;border:1.5px solid #e7c27c;background:radial-gradient(#7d1b10,#430b06);display:grid;place-items:center;margin-right:18px}
.opt b{margin-left:auto;font-size:38px;font-weight:400;opacity:.9}
.opt:hover,.opt.on{transform:translateX(8px);background:linear-gradient(180deg,#cc3d27,#82190f);box-shadow:0 0 0 4px rgba(70,14,8,.65),inset 0 2px 0 rgba(255,220,160,.45),0 0 28px rgba(255,120,40,.55)}
.side-foot{position:absolute;left:40px;right:40px;bottom:30px;font-size:17px;color:rgba(246,226,182,.62);display:flex;justify-content:space-between;border-top:1px solid rgba(236,198,127,.22);padding-top:14px;letter-spacing:1px}
.plum{position:absolute;background-size:contain;background-repeat:no-repeat;pointer-events:none}
.plum.tl{left:-6px;top:300px;width:420px;height:300px;opacity:.32}
.plum.br{right:-40px;bottom:-30px;width:520px;height:360px;transform:scaleX(-1);opacity:.9}

/* ---------- 右上悬挂 ---------- */
.banners{position:absolute;right:30px;top:92px;width:330px;height:440px;transition:opacity .5s,transform .5s}
.banners.hide{opacity:0;transform:translateY(-40px);pointer-events:none}
.banner{position:absolute;top:40px;width:72px;padding:24px 0 26px;border:2px solid var(--gold);border-radius:4px;
  background:linear-gradient(180deg,#b8291a,#7c140c);color:#ffe7b2;font-family:var(--fcal);font-size:42px;writing-mode:vertical-rl;text-align:center;letter-spacing:12px;
  box-shadow:inset 0 0 0 4px rgba(90,15,8,.7),inset 0 0 0 5px rgba(236,198,127,.5),0 0 26px rgba(255,80,30,.35);cursor:pointer;transform-origin:50% -40px;animation:sway 5s ease-in-out infinite}
.banner::before{content:"";position:absolute;top:-42px;left:50%;width:2px;height:40px;background:linear-gradient(var(--gold),#8a5a20)}
.banner::after{content:"";position:absolute;bottom:-34px;left:50%;margin-left:-4px;width:8px;height:32px;background:linear-gradient(#f2cc7c 0 8px,#c51f12 8px);border-radius:0 0 4px 4px}
.banner:hover{filter:brightness(1.18)}
.banner.b1{right:210px}
.banner.b2{right:118px;width:60px;font-size:27px;letter-spacing:7px;padding:18px 0 20px;animation-delay:-1.6s}
.hl{position:absolute;right:0;top:0;width:110px;transform-origin:50% 0;animation:sway 6.5s ease-in-out infinite;cursor:pointer}
.hl .str{width:2px;height:64px;background:var(--gold);margin:0 auto}
.hl .cap{width:54px;height:14px;margin:0 auto;background:linear-gradient(#f4cf7f,#a8742c);border-radius:4px}
.hl .body{width:110px;height:104px;margin:0 auto;border-radius:50%;position:relative;overflow:hidden;
  background:radial-gradient(circle at 50% 45%,#ffe08a 0,#ff8d3a 28%,#d4301b 60%,#7a120a 100%);box-shadow:0 0 60px 14px rgba(255,90,30,.45)}
.hl .body::before{content:"";position:absolute;inset:0;border-radius:50%;background:repeating-linear-gradient(90deg,transparent 0 17px,rgba(120,20,5,.35) 17px 19px)}
.hl .body span{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--fcal);font-size:46px;color:#fff0b8;text-shadow:0 0 8px #7a1a08}
.hl .tas{width:10px;height:74px;margin:0 auto;background:linear-gradient(#f4cf7f 0 14px,#c61f12 14px);border-radius:0 0 5px 5px}
@keyframes sway{0%,100%{transform:rotate(-2.2deg)}50%{transform:rotate(2.2deg)}}

/* ---------- 场景热点 ---------- */
.hs{position:absolute;left:0;top:0;pointer-events:auto;cursor:pointer;display:flex;flex-direction:column;align-items:center;will-change:transform;transition:opacity .3s}
.hs .tag{display:flex;align-items:center;gap:8px;padding:7px 18px;border:1.5px solid rgba(236,198,127,.85);border-radius:8px;background:rgba(70,14,8,.82);font-size:22px;color:#ffe9b8;white-space:nowrap;
  box-shadow:0 0 18px rgba(255,160,60,.35);font-family:var(--fcal);letter-spacing:3px;transition:.25s}
.hs .tag small{font-family:var(--fser);font-size:14px;letter-spacing:1px;color:#f0b26a}
.hs .stem{width:2px;height:44px;background:linear-gradient(rgba(236,198,127,.95),rgba(236,198,127,0))}
.hs .dot{width:14px;height:14px;border-radius:50%;background:#ffd27a;margin-top:-6px;animation:pulse 2s infinite}
.hs:hover .tag,.hs.hot .tag{background:rgba(170,40,20,.92);transform:translateY(-4px) scale(1.06);box-shadow:0 0 30px rgba(255,150,60,.7)}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(255,210,122,.8)}100%{box-shadow:0 0 0 18px rgba(255,210,122,0)}}

/* ---------- 右侧信息面板 ---------- */
.panel{position:absolute;right:40px;top:118px;width:450px;max-height:920px;overflow:auto;padding:38px 36px 32px;border-radius:16px;
  background:linear-gradient(180deg,rgba(62,15,10,.93),rgba(24,7,5,.92));border:1.5px solid rgba(236,198,127,.6);
  box-shadow:inset 0 0 0 6px rgba(20,5,3,.55),inset 0 0 0 7.5px rgba(236,198,127,.3),0 20px 60px rgba(0,0,0,.55);
  transform:translateX(540px);opacity:0;transition:transform .6s cubic-bezier(.2,.8,.2,1),opacity .45s;pointer-events:none;scrollbar-width:none}
.panel.show{transform:none;opacity:1;pointer-events:auto}
.pclose{position:absolute;right:18px;top:16px;width:42px;height:42px;border-radius:50%;border:1px solid rgba(236,198,127,.55);background:rgba(40,10,6,.6);color:var(--gold);font-size:26px;line-height:1}
.pclose:hover{background:rgba(170,40,20,.7)}
.ptag{font-size:16px;letter-spacing:4px;color:#eaa65c}
.ptitle{margin:6px 0 4px;font-family:var(--fcal);font-weight:400;font-size:62px;color:var(--gold);text-shadow:0 0 16px rgba(255,160,60,.45)}
.psub{font-size:19px;color:rgba(247,230,191,.78);letter-spacing:2px}
.pmeta{margin:20px 0;display:grid;gap:8px;font-size:18px;padding:14px 16px;border-radius:10px;background:rgba(0,0,0,.22);border:1px solid rgba(236,198,127,.18)}
.pmeta div{display:flex;gap:14px}.pmeta b{color:#eaa65c;font-weight:600;min-width:44px}
.pdesc{font-size:19px;line-height:1.85;color:#f2ddb2;margin:0 0 20px;text-align:justify}
.sec{font-size:17px;letter-spacing:3px;color:#eaa65c;margin:18px 0 10px;display:flex;align-items:center;gap:10px}
.sec::after{content:"";flex:1;height:1px;background:linear-gradient(90deg,rgba(236,198,127,.4),transparent)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:52px;padding:0 20px;white-space:nowrap;border-radius:26px;border:1.5px solid var(--gold);
  background:linear-gradient(180deg,#b9321e,#76140b);color:#fff0c8;font-size:21px;letter-spacing:3px;box-shadow:0 6px 18px rgba(0,0,0,.35),inset 0 1px 0 rgba(255,220,170,.4);transition:.2s}
.btn:hover{filter:brightness(1.15);box-shadow:0 0 22px rgba(255,130,50,.6)}
.btn.ghost{background:rgba(40,10,7,.6)}
.btn.wide{width:100%}
.row{display:flex;gap:12px}
.chips{display:flex;flex-wrap:wrap;gap:10px;margin:12px 0}
.chip{padding:6px 15px;border-radius:16px;border:1px solid rgba(236,198,127,.5);font-size:17px;color:#f7e6bf;background:rgba(80,20,10,.45);cursor:pointer;transition:.2s}
.chip:hover,.chip.on{background:rgba(180,50,25,.7)}
.field{width:100%;height:52px;border-radius:10px;border:1.5px solid rgba(236,198,127,.5);background:rgba(20,6,4,.6);color:#fbe9c2;font-size:20px;padding:0 16px;font-family:inherit;outline:none}
.field:focus{border-color:#ffd27a;box-shadow:0 0 14px rgba(255,190,90,.3)}
.swatches{display:flex;gap:16px;margin:8px 0 6px}
.sw{display:flex;flex-direction:column;align-items:center;gap:6px;font-size:15px;cursor:pointer;color:#f0dcb0}
.sw i{width:54px;height:54px;border-radius:50%;border:2px solid rgba(255,255,255,.25);transition:.2s}
.sw.on i{border-color:#ffe3a0;box-shadow:0 0 18px var(--c),0 0 0 4px rgba(236,198,127,.3)}
input[type=range]{width:100%;accent-color:#e9a45a}
.goods{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:18px}
.good{padding:10px 14px;border:1px solid rgba(236,198,127,.35);border-radius:10px;background:rgba(70,18,10,.45);cursor:pointer;font-size:19px;display:flex;justify-content:space-between;align-items:center;transition:.2s}
.good:hover{background:rgba(170,45,22,.6)}
.good small{color:#eaa65c;font-size:15px}

/* ---------- 底部控件 ---------- */
.ctrls{position:absolute;right:44px;bottom:40px;display:flex;gap:14px}
.cb{width:58px;height:58px;border-radius:50%;border:1.5px solid rgba(236,198,127,.6);background:rgba(40,10,7,.78);color:var(--gold);display:grid;place-items:center;position:relative;transition:.2s}
.cb:hover{background:rgba(170,40,20,.75);box-shadow:0 0 18px rgba(255,140,60,.5)}
.cb.on{background:linear-gradient(#b9321e,#7a150c);box-shadow:0 0 18px rgba(255,140,60,.5)}
.cb[data-tip]:hover::after{content:attr(data-tip);position:absolute;bottom:70px;left:50%;transform:translateX(-50%);white-space:nowrap;padding:6px 12px;background:rgba(30,8,6,.94);border:1px solid rgba(236,198,127,.5);border-radius:6px;font-size:16px;color:#f7e6bf}
.hint{position:absolute;left:1180px;bottom:40px;transform:translateX(-50%);font-size:18px;color:rgba(247,230,191,.72);letter-spacing:2px;white-space:nowrap;padding:8px 22px;border-radius:20px;background:rgba(20,6,4,.45);border:1px solid rgba(236,198,127,.18)}
.hint b{color:#f2b465;font-weight:600}
.verse{position:absolute;left:1180px;bottom:96px;transform:translateX(-50%);font-family:var(--fcal);font-size:38px;color:#ffe2a8;text-shadow:0 0 16px rgba(255,150,50,.65),0 2px 0 rgba(60,10,4,.8);letter-spacing:8px;white-space:nowrap;transition:opacity 1.2s}
.tourbar{position:absolute;left:1180px;top:130px;transform:translateX(-50%);display:none;align-items:center;gap:18px;padding:10px 14px 10px 26px;border-radius:30px;background:rgba(40,10,6,.88);border:1px solid rgba(236,198,127,.6);font-size:20px;letter-spacing:2px}
.tourbar.show{display:flex}
.tourbar .btn{height:42px;font-size:18px;padding:0 20px}

/* ---------- 弹窗 ---------- */
.mask{position:absolute;inset:0;background:rgba(5,2,2,.55);backdrop-filter:blur(3px);display:grid;place-items:center;opacity:0;pointer-events:none;transition:.35s}
.mask.show{opacity:1;pointer-events:auto}
.modal{position:relative;width:1100px;max-height:860px;overflow:auto;padding:52px 64px 48px;border-radius:18px;
  background:radial-gradient(circle at 50% 0,rgba(255,150,60,.14),transparent 50%),linear-gradient(180deg,rgba(64,16,10,.98),rgba(26,8,6,.98));
  border:1.5px solid rgba(236,198,127,.6);box-shadow:inset 0 0 0 8px rgba(20,5,3,.6),inset 0 0 0 9.5px rgba(236,198,127,.3),0 30px 80px rgba(0,0,0,.6);transform:scale(.94);transition:.35s;scrollbar-width:thin;scrollbar-color:#8a4a20 transparent}
.mask.show .modal{transform:none}
.modal .pclose{right:22px;top:20px}
.modal h3{font-family:var(--fcal);font-weight:400;font-size:58px;color:var(--gold);margin:0;text-shadow:0 0 18px rgba(255,160,60,.45)}
.modal .msub{font-size:19px;color:rgba(247,230,191,.7);letter-spacing:3px;margin:4px 0 26px}
.poemfull{font-family:var(--fcal);font-size:36px;line-height:1.9;color:#ffe6b0;letter-spacing:4px;padding:26px 34px;border-radius:12px;background:rgba(0,0,0,.25);border:1px solid rgba(236,198,127,.25);text-align:center}
.poemfull em{font-style:normal;color:#ffb860;text-shadow:0 0 10px rgba(255,140,40,.6)}
.cards{display:grid;grid-template-columns:repeat(2,1fr);gap:18px;margin-top:26px}
.cards.four{grid-template-columns:repeat(4,1fr)}
.card{padding:20px 22px;border-radius:12px;background:rgba(90,22,12,.4);border:1px solid rgba(236,198,127,.3);font-size:18px;line-height:1.75;color:#f2ddb2}
.card h4{margin:0 0 6px;font-family:var(--fcal);font-weight:400;font-size:30px;color:var(--gold)}
.card.click{cursor:pointer;transition:.25s}.card.click:hover{background:rgba(170,45,22,.5);transform:translateY(-4px)}
.card .meta{font-size:15px;color:#eaa65c;margin-top:8px}
.steps{display:grid;gap:12px;font-size:19px;line-height:1.7}
.steps div{display:flex;gap:16px;align-items:flex-start}
.steps b{flex:none;min-width:120px;color:#f2b465;font-weight:600}
.timeline{display:flex;gap:10px;margin-top:10px}
.timeline div{flex:1;padding:14px;border-radius:10px;background:rgba(90,22,12,.4);border:1px solid rgba(236,198,127,.28);text-align:center;font-size:17px}
.timeline b{display:block;font-size:26px;color:var(--gold);font-family:var(--fcal);font-weight:400}

/* 灯谜 */
.riddle{display:flex;gap:46px;align-items:center}
.rlantern{flex:none;width:280px;height:340px;position:relative;display:flex;flex-direction:column;align-items:center}
.rlantern .cap{width:120px;height:22px;background:linear-gradient(#f4cf7f,#a8742c);border-radius:5px}
.rlantern .bd{width:280px;height:270px;border-radius:50%;background:radial-gradient(circle at 50% 45%,#ffe08a 0,#ff8d3a 30%,#d4301b 62%,#7a120a 100%);box-shadow:0 0 80px 20px rgba(255,90,30,.4);position:relative;overflow:hidden;display:grid;place-items:center}
.rlantern .bd::before{content:"";position:absolute;inset:0;border-radius:50%;background:repeating-linear-gradient(90deg,transparent 0 30px,rgba(120,20,5,.3) 30px 33px)}
.rlantern .bd span{position:relative;font-family:var(--fcal);font-size:120px;color:#fff0b8;text-shadow:0 0 12px #7a1a08}
.rlantern .tas{width:16px;height:60px;background:linear-gradient(#f4cf7f 0 16px,#c61f12 16px);border-radius:0 0 6px 6px}
.rbody{flex:1}
.rq{font-family:var(--fcal);font-size:44px;line-height:1.55;color:#ffe6b0;letter-spacing:4px;min-height:140px}
.rq small{display:block;font-family:var(--fser);font-size:20px;color:#eaa65c;letter-spacing:2px;margin-top:8px}
.ropts{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin:24px 0 18px}
.ropt{height:68px;border-radius:12px;border:1.5px solid rgba(236,198,127,.6);background:rgba(80,20,10,.55);font-family:var(--fcal);font-size:32px;color:#ffe9b8;transition:.2s}
.ropt:hover{background:rgba(170,45,22,.75)}
.ropt.ok{background:linear-gradient(#d9a540,#8a5a14);color:#fff;border-color:#ffe3a0;box-shadow:0 0 24px rgba(255,200,90,.7)}

function mergeStatic(root) {
  root.updateMatrixWorld(true);
  const buckets = new Map(), markers = [], keep = [];
  root.traverse(o => {
    if (o.userData.m) markers.push({ t: o.userData.m, p: new V3().setFromMatrixPosition(o.matrixWorld), s: o.userData.s });
    if (o.userData.flag) { keep.push(o); return; }
    if (!o.isMesh) return;
    let b = buckets.get(o.material); if (!b) { b = []; buckets.set(o.material, b); }
    let g = o.geometry.index ? o.geometry.toNonIndexed() : o.geometry.clone();
    for (const k of Object.keys(g.attributes)) if (!['position', 'normal', 'uv'].includes(k)) g.deleteAttribute(k);
    if (!g.attributes.normal) g.computeVertexNormals();
    if (!g.attributes.uv) g.setAttribute('uv', new THREE.BufferAttribute(new Float32Array(g.attributes.position.count * 2), 2));
    g.applyMatrix4(o.matrixWorld); g.clearGroups(); b.push(g);
  });

    <div><b>平移画面</b>按住右键拖拽（触屏双指拖动），在城中平移。</div>
    <div><b>进入活动</b>点击左侧选项、场景中的金色标签或直接点击场景区域；按 Esc 返回。</div>
    <div><b>快捷键</b>R 重置视角 · Space 自动环游 · F 燃放烟花</div>
  </div>
  <div class="sec" style="margin-top:28px">推荐游线</div>
  <div class="timeline"><div><b>17:00</b>元宵市集</div><div><b>18:30</b>灯会祈福</div><div><b>19:30</b>铁花演出</div><div><b>20:00</b>手作工坊</div><div><b>21:00</b>猜灯谜</div></div>`, 'guide');
}
function pageCulture() {
  openModal(`<h3>文化典故</h3><div class="msub">南宋 · 辛弃疾《青玉案·元夕》</div>
  <div class="poemfull">东风夜放<em>花千树</em>，更吹落、<em>星如雨</em>。宝马雕车香满路。<br>凤箫声动，<em>玉壶光转</em>，一夜<em>鱼龙舞</em>。<br>
  <em>蛾儿雪柳</em>黄金缕，笑语盈盈暗香去。<br>众里寻他千百度，蓦然回首，那人却在，灯火阑珊处。</div>
  <div class="cards">
    <div class="card"><h4>花千树 · 星如雨</h4>写满城灯火如千树花开，烟火流星似雨坠落。本页的铁花与烟花，即取此意。</div>
    <div class="card"><h4>玉壶光转</h4>“玉壶”喻明月，亦指白玉灯；“光转”写月移灯旋，恰似走马灯流转不息。</div>
    <div class="card"><h4>鱼龙舞</h4>鱼形、龙形的彩灯在人潮中翻腾舞动，是宋代元宵灯会的经典景象。</div>
    <div class="card"><h4>蛾儿雪柳</h4>宋代女子元宵节佩戴的应节头饰，以彩绸、金线扎成，游人盛装出行。</div>
    <div class="card"><h4>放灯五夜</h4>北宋乾德年间，元宵放灯由三夜增为五夜；《东京梦华录》载灯山“金碧相射，锦绣交辉”。</div>
    <div class="card"><h4>灯谜 · 走马灯</h4>南宋《武林旧事》记灯品：“以绢灯剪写诗词……藏头隐语”，又有“马骑人物，旋转如飞”。</div>
  </div>`, 'culture');
}
function pageMine() {
  const w = state.wishes.length ? `<div class="wishlist">${state.wishes.map(s => `<span>${s}</span>`).join('')}</div>` : `<div class="mine-empty">还未放飞孔明灯——去「灯会祈福」写下第一个心愿吧。</div>`;
  openModal(`<h3>我的元夕</h3><div class="msub">今夜足迹</div>
  <div class="sec">放飞的心愿</div>${w}
  <div class="cards four" style="margin-top:24px">
    <div class="card"><h4>${state.solved.size} / ${RIDDLES.length}</h4>猜中灯谜</div>
    <div class="card"><h4>${state.color}</h4>我的灯纸</div>
    <div class="card"><h4>${state.shows} 场</h4>开演铁花</div>
    <div class="card"><h4>${state.tasted.length} 样</h4>市集尝鲜</div>
  </div>`, 'mine');
}

/* 灯谜 */
const RIDDLES = [
  ['画时圆，写时方，冬时短，夏时长。', '打一字', ['日', '月', '田', '口'], 0, '画的太阳是圆的，写的“日”字是方的；冬日昼短、夏日昼长。'],
  ['一口咬掉牛尾巴。', '打一字', ['午', '告', '生', '吉'], 1, '“牛”去掉尾巴，加上“口”，便是“告”。'],
  ['千里相逢。', '打一字', ['里', '逢', '重', '量'], 2, '“千”与“里”上下相逢，合成“重”。'],
  ['半个月亮。', '打一字', ['胖', '朋', '明', '期'], 0, '“半”加“月”，正是“胖”。'],
  ['自大一点。', '打一字', ['犬', '臭', '息', '太'], 1, '“自”下加“大”，再添一点，即“臭”。'],
  ['一边是红，一边是绿；一边喜风，一边喜雨。', '打一字', ['秋', '炒', '灵', '烁'], 0, '“火”红喜风，“禾”绿喜雨，合为“秋”。'],
  ['有面无口，有脚无手，听人讲话，陪人吃酒。', '打一物', ['椅子', '酒壶', '灯笼', '桌子'], 3, '桌面无口、桌腿无手，宴饮时总在一旁。'],
  ['小时青青腹中空，长大头发蓬蓬松；姐姐撑船不离它，哥哥钓鱼拿手中。', '打一物', ['芦苇', '竹子', '柳树', '荷花'], 1, '竹子中空，撑船的篙、钓鱼的竿皆是竹。'],
];
let rIdx = 0;
function openRiddle(i = rIdx) {
  rIdx = (i + RIDDLES.length) % RIDDLES.length; const r = RIDDLES[rIdx];
  openModal(`<h3>猜灯谜 · 赢彩头</h3><div class="msub">灯谜社 · 揭笺而猜</div>
  <div class="riddle"><div class="rlantern"><div class="cap"></div><div class="bd"><span>${state.solved.has(rIdx) ? '中' : '谜'}</span></div><div class="tas"></div></div>
  <div class="rbody"><div class="rq">${r[0]}<small>（${r[1]}）</small></div>
  <div class="ropts">${r[2].map((o, k) => `<button class="ropt" data-k="${k}">${o}</button>`).join('')}</div>
  <div class="rfb" id="rfb"></div>
  <div class="rfoot"><span>第 ${rIdx + 1} / ${RIDDLES.length} 笺 · 已猜中 ${state.solved.size}</span><span class="row"><button class="btn ghost" id="rPrev">上一笺</button><button class="btn" id="rNext">下一笺</button></span></div>
  </div></div>`);
  $$('.ropt', modal).forEach(b => b.onclick = () => {
    const k = +b.dataset.k;
    if (k === r[3]) {
      b.classList.add('ok'); state.solved.add(rIdx); $('.rlantern span', modal).textContent = '中';
      $('#rfb').innerHTML = `<b style="color:#ffd27a">猜中了！</b>${r[4]}${state.solved.size === RIDDLES.length ? '<br>🎉 全部猜中，彩头一份：今夜灯市任你逛！' : ''}`;
      sparkBurstUI();
    } else { b.classList.remove('no'); void b.offsetWidth; b.classList.add('no'); $('#rfb').textContent = '差了一点，再想想～'; }
  });
  $('#rPrev').onclick = () => openRiddle(rIdx - 1); $('#rNext').onclick = () => openRiddle(rIdx + 1);
}
function sparkBurstUI() { fwSalvo = Math.max(fwSalvo, 2); fwTimer = 0; }

/* 绑定 */
$$('.opt').forEach(b => b.onclick = () => openZone(b.dataset.zone));
$$('[data-act="riddle"]').forEach(b => b.onclick = () => openRiddle());
$$('[data-nav]').forEach(a => a.onclick = () => {
  const k = a.dataset.nav;
  if (k === 'home') { closeModal(); closePanel(); endTour(); flyTo(HOME.p, HOME.t, 2); setNav('home'); }
  if (k === 'overview') pageOverview(); if (k === 'guide') pageGuide(); if (k === 'culture') pageCulture(); if (k === 'mine') pageMine();
});
$('#userBtn').onclick = pageMine;
$('#bellBtn').onclick = () => { toast('今夜：19:30 头场铁花 · 20:30 上元烟火 · 21:00 二场铁花', 3600); $('#bellBtn .dot')?.remove(); };
const SEARCH = [[/谜/, () => openRiddle()], [/铁|烟|火|演|戏/, () => openZone('iron')], [/市|集|汤|圆|吃|糖|面人|街/, () => openZone('market')], [/工坊|手作|走马|扎|做/, () => openZone('craft')], [/祈|福|愿|孔明|灯台|宫灯/, () => openZone('pray')], [/诗|词|辛|典|故|青玉案/, pageCulture], [/指南|操作|怎么/, pageGuide]];
function doSearch() { const q = $('#searchInput').value.trim(); if (!q) return; const hit = SEARCH.find(([re]) => re.test(q)); if (hit) { hit[1](); $('#searchInput').value = ''; $('#searchInput').blur(); } else toast(`未寻得「${q}」，试试：灯谜、铁花、汤圆、走马灯`); }
$('#searchInput').addEventListener('keydown', e => { e.stopPropagation(); if (e.key === 'Enter') doSearch(); });
$('#searchBtn').onclick = doSearch;
$('#tourStop').onclick = () => endTour();
$('#cbHome').onclick = () => { closePanel(); endTour(); flyTo(HOME.p, HOME.t, 1.8); };
$('#cbRotate').onclick = () => { controls.autoRotate = !controls.autoRotate; $('#cbRotate').classList.toggle('on', controls.autoRotate); };
function dolly(f) { fly = null; const d = camera.position.clone().sub(controls.target); const nd = THREE.MathUtils.clamp(d.length() * f, controls.minDistance, controls.maxDistance); flyTo(controls.target.clone().add(d.setLength(nd)).toArray(), controls.target.toArray(), .6); }
$('#cbIn').onclick = () => dolly(.7); $('#cbOut').onclick = () => dolly(1.4);
$('#cbFire').onclick = () => { fwSalvo = 8; fwTimer = 0; toast('烟火升空——更吹落、星如雨'); };
$('#cbFull').onclick = () => { if (!document.fullscreenElement) document.documentElement.requestFullscreen?.(); else document.exitFullscreen?.(); };
$('#cbShot').onclick = () => { composer.render(); const a = document.createElement('a'); a.download = '青玉案·元夕-灯下留影.png'; a.href = canvas.toDataURL('image/png'); a.click(); toast('已保存灯下留影'); };
window.addEventListener('keydown', e => {
  if (e.target.tagName === 'INPUT') return;
  if (vrOpen) { if (e.key === 'Escape') exitVR(); return; }
  if (e.key === 'Escape') { if (tour) endTour(); else if (mask.classList.contains('show')) closeModal(); else closePanel(); }
  if (e.key === 'r' || e.key === 'R') $('#cbHome').click();
  if (e.key === 'f' || e.key === 'F') $('#cbFire').click();
  if (e.key === ' ') { e.preventDefault(); $('#cbRotate').click(); }
});

/* 场景热点 */
const hsWrap = $('#hotspots');
const hotspots = Object.entries(ZONES).map(([k, z]) => {
  const el = document.createElement('div'); el.className = 'hs';
  el.innerHTML = `<div class="tag">${z.name}<small>${z.place}</small></div><div class="stem"></div><div class="dot"></div>`;
  el.onclick = () => openZone(k); hsWrap.appendChild(el);
  return { k, el, pos: new V3(...z.label) };
});
function updHotspots() {
  for (const h of hotspots) {
    _p.copy(h.pos).project(camera);
    const vis = !tour && _p.z < 1 && Math.abs(_p.x) < 1.05 && Math.abs(_p.y) < 1.05 && h.k !== currentZone;
    h.el.style.display = vis ? '' : 'none';
    if (vis) h.el.style.transform = `translate(${(_p.x * .5 + .5) * 1920}px,${(-_p.y * .5 + .5) * 1080}px) translate(-50%,-100%)`;
  }
}
/* 点击场景区域 */
const ray = new THREE.Raycaster(), ndc = new THREE.Vector2(), ground = new THREE.Plane(new V3(0, 1, 0), 0), hitP = new V3();
function zoneAt(e) {
  const r = canvas.getBoundingClientRect(); ndc.set((e.clientX - r.left) / r.width * 2 - 1, -(e.clientY - r.top) / r.height * 2 + 1);
  ray.setFromCamera(ndc, camera); if (!ray.ray.intersectPlane(ground, hitP)) return null;
  for (const [k, z] of Object.entries(ZONES)) { const [x0, x1, z0, z1] = z.rect; if (hitP.x > x0 && hitP.x < x1 && hitP.z > z0 && hitP.z < z1) return k; }
  return null;
}
let down = null;
canvas.addEventListener('pointerdown', e => { down = { x: e.clientX, y: e.clientY, t: performance.now() }; });
canvas.addEventListener('pointerup', e => {
  if (!down || tour) return; const moved = Math.hypot(e.clientX - down.x, e.clientY - down.y); const dt = performance.now() - down.t; down = null;
  if (moved < 5 && dt < 400 && e.button === 0) { const k = zoneAt(e); if (k) openZone(k); }
});
let hoverT = 0;
canvas.addEventListener('pointermove', e => {
  if (e.buttons || tour) return; const now = performance.now(); if (now - hoverT < 60) return; hoverT = now;
  const k = zoneAt(e); canvas.style.cursor = k ? 'pointer' : 'grab'; hotspots.forEach(h => h.el.classList.toggle('hot', h.k === k));
});

/* 诗句轮播 & 时辰 */
const VERSES = ['东风夜放花千树', '更吹落、星如雨', '宝马雕车香满路', '凤箫声动，玉壶光转', '一夜鱼龙舞', '蛾儿雪柳黄金缕', '笑语盈盈暗香去', '众里寻他千百度', '蓦然回首', '那人却在，灯火阑珊处'];
let vIdx = 0;
setInterval(() => { const v = $('#verse'); v.style.opacity = 0; setTimeout(() => { vIdx = (vIdx + 1) % VERSES.length; v.textContent = VERSES[vIdx]; v.style.opacity = 1; }, 1200); }, 6000);
function updClock() { const h = new Date().getHours(); const names = ['子', '丑', '寅', '卯', '辰', '巳', '午', '未', '申', '酉', '戌', '亥']; $('#clock').textContent = names[Math.floor(((h + 1) % 24) / 2)] + '时 · 灯火正明'; }
updClock(); setInterval(updClock, 60000);

/* ================= 尺寸 & 循环 ================= */
let W = 1, H = 1, uiScale = 1;
function resize() {
  const vw = innerWidth, vh = innerHeight; let w = vw, h = vw * 9 / 16; if (h > vh) { h = vh; w = vh * 16 / 9; }
  W = Math.round(w); H = Math.round(h);
  stageEl.style.width = W + 'px'; stageEl.style.height = H + 'px'; stageEl.scrollLeft = stageEl.scrollTop = 0;
  uiScale = W / 1920; ui.style.transform = `scale(${uiScale})`;
  stageEl.style.setProperty('--u', uiScale);
  renderer.setPixelRatio(pixelRatio); renderer.setSize(W, H, false);
  composer.setPixelRatio(pixelRatio); composer.setSize(W, H);
  camera.aspect = W / H; applyView();
  U.uScale.value = H * pixelRatio * .5 * camera.projectionMatrix.elements[5];
}
window.addEventListener('resize', resize); resize();
stageEl.addEventListener('scroll', () => { stageEl.scrollLeft = stageEl.scrollTop = 0; });

const clock = new THREE.Clock();
let time = 0, paperAcc = 0, fpsT = 0, fpsN = 0, lowCount = 0;
function loop() {
  requestAnimationFrame(loop);
  if (vrCovered) { clock.getDelta(); return; } // 全景层完全覆盖时暂停主场景渲染，保证流畅
  const dt = Math.min(clock.getDelta(), .05); time += dt; U.uTime.value = time;

  if (Math.abs(viewShift - viewShiftT) > .0005) { viewShift += (viewShiftT - viewShift) * Math.min(1, dt * 4); applyView(); }
  if (!updTour(dt)) {
    updFly(dt); controls.update();
    const t = controls.target; t.x = THREE.MathUtils.clamp(t.x, -65, 65); t.z = THREE.MathUtils.clamp(t.z, -65, 65); t.y = THREE.MathUtils.clamp(t.y, 0, 45);
  }
  paperAcc += dt; paperOff += paperSpeed * dt;
  if (paperAcc > 1 / 30) { paperAcc = 0; composePaper(); }
  updLanterns(time); updPeople(dt, time); updKongming(dt, time); updLotus(dt, time); updWish(dt);
  updIron(dt); updFireworks(dt); sparks.update(dt);
  updHotspots();
  composer.render();

  fpsT += dt; fpsN++;
  if (fpsT > 2) { const fps = fpsN / fpsT; fpsT = fpsN = 0; if (fps < 42 && pixelRatio > 1) { if (++lowCount >= 2) { pixelRatio = Math.max(1, pixelRatio - .25); resize(); lowCount = 0; } } else lowCount = 0; }
}
loop();
window.__ready = true;
window.__dbg = { THREE, scene, camera, controls, flyTo, openZone, bgm, bgmState: () => ({ want: bgmWant, vrOpen, vrCovered }), exitVR, renderer, bloom, sparks, IRON, U };
setTimeout(() => $('#loader').classList.add('done'), 400);
</script>
</body>
