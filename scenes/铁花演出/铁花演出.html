<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>铜梁龙 · 火树银花 —— 360° VR 全景</title>
<link rel="stylesheet" href="lib/pannellum.css">
<style>
  :root {
    --song: "Songti SC", "STSong", "SimSun", "宋体", "NSimSun", "Noto Serif SC", "Source Han Serif SC", serif;
    --gold: #f3c76a;
    --gold-2: #ffdf9a;
    --red: #b3241c;
    --ink: #120806;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; color: #f6e7c8; font-family: var(--song); }
  button { font-family: inherit; color: inherit; }
  #app { position: fixed; inset: 0; background: #000; }
  #pano { position: absolute; inset: 0; }
  #fx { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 2; }
  #vignette {
    position: absolute; inset: 0; pointer-events: none; z-index: 3;
    background:
      radial-gradient(ellipse at 50% 55%, transparent 55%, rgba(0,0,0,.55) 100%),
      linear-gradient(to bottom, rgba(0,0,0,.35), transparent 14%, transparent 86%, rgba(0,0,0,.4));
  }
  /* Pannellum 自带界面收起，使用自定义控件 */
  .pnlm-container { background: #000 !important; }
  .pnlm-load-box { display: none !important; }
  .pnlm-about-msg { display: none !important; }

  /* ---------- 场景热点 ---------- */
  .hs { width: 46px; height: 46px; cursor: pointer; }
  .hs .hs-dot { position: absolute; left: 50%; top: 50%; width: 14px; height: 14px; margin: -7px 0 0 -7px; border-radius: 50%;
    background: radial-gradient(circle, #fff6d8 0 30%, #ffc75a 60%, #d9631b 100%); box-shadow: 0 0 14px 4px rgba(255,180,70,.85); }
  .hs .hs-ring { position: absolute; inset: 0; border-radius: 50%; border: 1.5px solid rgba(255,214,130,.9); animation: ring 2.2s ease-out infinite; }
  .hs .hs-ring.r2 { animation-delay: 1.1s; }
  .hs .hs-label { position: absolute; left: 50%; top: -30px; transform: translateX(-50%); white-space: nowrap; font-size: 15px; letter-spacing: .25em;
    padding: 3px 6px 3px 10px; color: #ffe7b0; background: rgba(60,10,6,.72); border: 1px solid rgba(243,199,106,.55); border-radius: 2px; text-shadow: 0 0 6px #000; }
  .hs.active .hs-ring { border-color: #fff1c2; }
  @keyframes ring { from { transform: scale(.35); opacity: 1; } to { transform: scale(1.5); opacity: 0; } }

  /* ---------- 左侧提示框 ---------- */
  #cards { position: absolute; left: clamp(14px, 2.6vw, 40px); top: 50%; transform: translateY(-50%); z-index: 10;
    display: flex; flex-direction: column; gap: 18px; }
  .card {
    position: relative; display: flex; align-items: center; gap: 14px; width: 210px; padding: 14px 18px 14px 14px; cursor: pointer;
    background: linear-gradient(135deg, rgba(92,16,10,.82), rgba(28,6,4,.78)); border: 1px solid rgba(243,199,106,.55);
    border-radius: 3px; text-align: left; backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px);
    box-shadow: 0 8px 28px rgba(0,0,0,.45), inset 0 0 0 4px rgba(0,0,0,.18), inset 0 0 0 5px rgba(243,199,106,.16);
    transition: transform .25s ease, box-shadow .3s ease, border-color .3s ease, background .3s ease;
  }
  .card::before, .card::after { content: ""; position: absolute; width: 10px; height: 10px; border: 2px solid var(--gold); }
  .card::before { left: -3px; top: -3px; border-right: 0; border-bottom: 0; }
  .card::after { right: -3px; bottom: -3px; border-left: 0; border-top: 0; }
  .card:hover { transform: translateX(4px); border-color: rgba(255,223,154,.9); }
  .card:active { transform: translateX(4px) scale(.98); }
  .card .ico { flex: 0 0 52px; height: 52px; display: grid; place-items: center; border-radius: 50%;
    background: radial-gradient(circle at 50% 45%, rgba(255,190,90,.28), rgba(0,0,0,0) 70%); border: 1px solid rgba(243,199,106,.35); }
  .card .ico svg { width: 36px; height: 36px; }
  .card b { display: block; font-size: 26px; font-weight: 700; letter-spacing: .28em; color: var(--gold-2);
    text-shadow: 0 0 10px rgba(255,170,60,.45); }
  .card i { display: block; white-space: nowrap; margin-top: 4px; font-style: normal; font-size: 12.5px; letter-spacing: .18em; color: rgba(246,231,200,.72); }
  .card .state { position: absolute; right: 10px; top: 8px; font-size: 11px; letter-spacing: .1em; color: rgba(246,231,200,.5); }
  .card.active { background: linear-gradient(135deg, rgba(170,38,20,.9), rgba(70,12,6,.85)); border-color: #ffe2a0;
    box-shadow: 0 0 26px rgba(255,150,50,.55), 0 8px 28px rgba(0,0,0,.45), inset 0 0 0 4px rgba(0,0,0,.18), inset 0 0 0 5px rgba(255,223,154,.35); }
  .card.active .state { color: #ffe2a0; }
  .card.active .ico { animation: glow 1.2s ease-in-out infinite alternate; }
  @keyframes glow { from { box-shadow: 0 0 6px rgba(255,180,70,.4); } to { box-shadow: 0 0 22px rgba(255,190,80,.95); } }
  #cardsHint { font-size: 12px; letter-spacing: .2em; color: rgba(246,231,200,.6); padding-left: 4px; animation: breathe 2.4s ease-in-out infinite; }
  @keyframes breathe { 50% { opacity: .35; } }

  /* ---------- 右侧文字 ---------- */
  #poem {
    position: absolute; right: clamp(16px, 3vw, 48px); top: 9vh; z-index: 10; width: min(420px, 32vw); max-height: 60vh; overflow: auto;
    padding: 30px 30px 26px 32px; font-family: var(--song); color: #f8ecd2;
    background: linear-gradient(160deg, rgba(40,8,5,.78), rgba(10,3,2,.62)); border: 1px solid rgba(243,199,106,.45);
    box-shadow: 0 12px 40px rgba(0,0,0,.5), inset 0 0 0 6px rgba(0,0,0,.15), inset 0 0 0 7px rgba(243,199,106,.14);
    backdrop-filter: blur(5px); -webkit-backdrop-filter: blur(5px);
    opacity: 0; visibility: hidden; transform: translateX(30px); transition: opacity .8s ease, transform .8s ease, visibility 0s linear .8s;
    scrollbar-width: thin; scrollbar-color: rgba(243,199,106,.4) transparent;
  }
  #poem.show { opacity: 1; visibility: visible; transform: none; transition: opacity .8s ease, transform .8s ease; }
  #poem .seal { position: absolute; right: 14px; bottom: 14px; width: 42px; height: 42px; display: grid; place-items: center; font-size: 13px; line-height: 1.05;
    text-align: center; color: #fbe3c0; background: #a3221a; border-radius: 3px; box-shadow: inset 0 0 0 2px #a3221a, inset 0 0 0 3px rgba(255,220,180,.6); opacity: .9; letter-spacing: 0; }
  #poem .close { position: absolute; right: 8px; top: 6px; width: 28px; height: 28px; border: 0; background: none; font-size: 20px; cursor: pointer; color: rgba(246,231,200,.6); }
  #poem .close:hover { color: #fff; }
  #poem .ln { margin: 0; }
  #poem .title { font-size: clamp(19px, 1.65vw, 25px); font-weight: 700; line-height: 1.6; letter-spacing: .08em; color: #fff3d6; text-shadow: 0 0 12px rgba(255,160,60,.45); }
  #poem .title em { font-style: normal; color: var(--gold); }
  #poem .verse { margin-top: 14px; font-size: clamp(15px, 1.2vw, 18px); line-height: 1.95; letter-spacing: .06em; color: #f7dfae; }
  #poem .rule { height: 1px; margin: 16px 0 14px; background: linear-gradient(90deg, rgba(243,199,106,.75), rgba(243,199,106,0)); transform-origin: left; transform: scaleX(0); transition: transform 1s ease .2s; }
  #poem.show .rule { transform: scaleX(1); transition-delay: 2.2s; }
  #poem .body { font-size: clamp(13.5px, 1.02vw, 15.5px); line-height: 2; text-indent: 2em; letter-spacing: .04em; color: rgba(248,236,210,.9); padding-right: 30px; }
  #poem .ch { display: inline-block; text-indent: 0; white-space: nowrap; opacity: 0; filter: blur(6px); transform: translateY(6px); }
  #poem.show .ch { animation: ink .9s cubic-bezier(.2,.7,.2,1) forwards; animation-delay: calc(var(--d) * 1ms); }
  @keyframes ink { to { opacity: 1; filter: blur(0); transform: none; } }

  /* ---------- 底部工具栏 ---------- */
  #toolbar { position: absolute; left: 50%; bottom: 22px; transform: translateX(-50%); z-index: 10; display: flex; gap: 6px; padding: 6px 8px;
    background: rgba(20,6,4,.62); border: 1px solid rgba(243,199,106,.32); border-radius: 26px; backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px); }
  #toolbar button { width: 40px; height: 40px; border: 0; border-radius: 50%; background: transparent; cursor: pointer; display: grid; place-items: center; color: #f3d9a4; transition: background .2s; }
  #toolbar button:hover { background: rgba(243,199,106,.16); }
  #toolbar button.on { background: rgba(243,199,106,.24); color: #fff2cc; }
  #toolbar svg { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }
  #toolbar .sep { width: 1px; margin: 8px 2px; background: rgba(243,199,106,.25); }
  #hint { position: absolute; left: 50%; bottom: 76px; transform: translateX(-50%); z-index: 9; font-size: 13px; letter-spacing: .25em; color: rgba(246,231,200,.7);
    text-shadow: 0 1px 4px #000; transition: opacity .8s; pointer-events: none; white-space: nowrap; }
  #hint.hide { opacity: 0; }

  /* ---------- 开场 ---------- */
  #intro { position: absolute; inset: 0; z-index: 20; display: grid; place-items: center; text-align: center;
    background: radial-gradient(ellipse at 50% 45%, rgba(80,18,8,.75), rgba(0,0,0,.94) 70%); transition: opacity 1.1s ease, visibility 0s linear 1.1s; }
  #intro.gone { opacity: 0; visibility: hidden; }
  #intro h1 { margin: 0; font-size: clamp(34px, 5.2vw, 68px); letter-spacing: .32em; font-weight: 700; color: #ffe3a6; text-shadow: 0 0 24px rgba(255,150,40,.6); padding-left: .32em; }
  #intro p { margin: 14px 0 0; font-size: clamp(13px, 1.2vw, 17px); letter-spacing: .4em; color: rgba(246,231,200,.72); padding-left: .4em; }
  #intro .orn { width: 220px; height: 1px; margin: 22px auto; background: linear-gradient(90deg, transparent, var(--gold), transparent); }
  #enter { margin-top: 26px; padding: 13px 40px 13px 46px; font-size: 18px; letter-spacing: .5em; cursor: pointer; color: #ffeec8;
    background: linear-gradient(135deg, #a32a18, #5a0f08); border: 1px solid #f3c76a; border-radius: 2px; box-shadow: 0 0 24px rgba(255,140,40,.35); transition: transform .2s, box-shadow .2s, opacity .3s; }
  #enter:hover:not(:disabled) { transform: translateY(-2px); box-shadow: 0 0 34px rgba(255,160,60,.6); }
  #enter:disabled { opacity: .45; cursor: wait; }
  #status { margin-top: 16px !important; font-size: 12px !important; letter-spacing: .25em !important; color: rgba(246,231,200,.5) !important; }

  @media (max-width: 760px) {
    #cards { top: auto; bottom: 86px; transform: none; flex-direction: row; gap: 10px; left: 12px; }
    #cardsHint { display: none; }
    .card { width: auto; padding: 9px 12px 9px 9px; gap: 8px; }
    .card .ico { flex-basis: 36px; height: 36px; } .card .ico svg { width: 24px; height: 24px; }
    .card b { font-size: 18px; letter-spacing: .15em; } .card i, .card .state { display: none; }
    #poem { top: 12px; right: 12px; left: 12px; width: auto; max-height: 46vh; padding: 20px 18px 18px; }
    #hint { bottom: 156px; }
  }
</style>
</head>
<body>
<div id="app">
  <div id="pano"></div>
  <canvas id="fx"></canvas>
  <div id="vignette"></div>

  <aside id="cards">
    <button class="card" data-mode="fire" aria-pressed="false">
      <span class="ico"><svg viewBox="0 0 40 40" aria-hidden="true"><g stroke="#ffd27a" stroke-width="1.6" stroke-linecap="round">
        <path d="M20 21 L20 5"/><path d="M20 21 L31 9"/><path d="M20 21 L9 9"/><path d="M20 21 L36 18"/><path d="M20 21 L4 18"/>
        <path d="M20 21 L33 30" opacity=".7"/><path d="M20 21 L7 30" opacity=".7"/><path d="M20 21 L26 36" opacity=".5"/><path d="M20 21 L14 36" opacity=".5"/></g>
        <circle cx="20" cy="21" r="4" fill="#fff1c4"/></svg></span>
      <span><b>打铁花</b><i>点击 · 铁花迸发</i></span><span class="state">未开启</span>
    </button>
    <button class="card" data-mode="dragon" aria-pressed="false">
      <span class="ico"><svg viewBox="0 0 40 40" aria-hidden="true"><g fill="none" stroke="#ffd27a" stroke-width="2.2" stroke-linecap="round">
        <path d="M3 25 C8 15, 12 15, 16 23 S24 31, 28 20 S33 11, 36 14"/></g>
        <path d="M36 14 l2 -5 l-1 6 l3 1 z" fill="#ffd27a"/><circle cx="35.4" cy="13" r="1" fill="#5a0f08"/>
        <g stroke="#ffd27a" stroke-width="1.2" opacity=".7"><path d="M10 18v14"/><path d="M19 26v8"/><path d="M28 20v13"/></g></svg></span>
      <span><b>舞　龙</b><i>点击 · 金龙腾舞</i></span><span class="state">未开启</span>
    </button>
    <div id="cardsHint">点击提示框 · 开启互动</div>
  </aside>

  <section id="poem" aria-live="polite">
    <button class="close" title="收起文字" aria-label="收起文字">×</button>
    <h2 class="ln title">舞“{龙}”兆“{吉祥}”，祈“{丰}”调雨“{顺}”。</h2>
    <p class="ln verse">正月十五日，天花无数月中开<br>十万人潮，玉壶光转，一夜鱼龙舞。</p>
    <div class="rule"></div>
    <p class="ln body">铜梁龙文化是重庆铜梁极具代表性的非物质文化遗产，其历史可追溯至唐代，经明清兴盛传承至今，2006年铜梁龙舞被列入首批国家级非物质文化遗产名录，铜梁也被誉为“中国民间文化艺术(龙灯)之乡”。</p>
    <div class="seal">铜梁<br>龙舞</div>
  </section>

  <nav id="toolbar">
    <button id="bZoomOut" title="缩小"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="6.5"/><path d="M8 11h6M16 16l4.5 4.5"/></svg></button>
    <button id="bZoomIn" title="放大"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="6.5"/><path d="M8 11h6M11 8v6M16 16l4.5 4.5"/></svg></button>
    <button id="bHome" title="回到正视角"><svg viewBox="0 0 24 24"><path d="M4 11.5 12 5l8 6.5"/><path d="M6.5 10v9h11v-9"/></svg></button>
    <button id="bRotate" title="自动环视"><svg viewBox="0 0 24 24"><path d="M19.5 12a7.5 7.5 0 1 1-2.2-5.3"/><path d="M19.5 4v4.5H15"/></svg></button>
    <span class="sep"></span>
    <button id="bMusic" title="背景音乐"><svg viewBox="0 0 24 24"><path d="M9 18V6l10-2v12"/><circle cx="6.5" cy="18" r="2.5"/><circle cx="16.5" cy="16" r="2.5"/><path class="mute" d="M3 3l18 18" style="display:none"/></svg></button>
    <button id="bFull" title="全屏"><svg viewBox="0 0 24 24"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg></button>
  </nav>
  <div id="hint">拖动画面环视 · 滚轮 / 双指缩放</div>

  <div id="intro">
    <div>
      <h1>铜梁龙 · 火树银花</h1>
      <p>国家级非物质文化遗产 · 360° 沉浸全景</p>
      <div class="orn"></div>
      <button id="enter" disabled>进入全景</button>
      <p id="status">全景拼接中…</p>
    </div>
  </div>

  <audio id="bgm" loop preload="none"></audio>
</div>

<script src="lib/pannellum.js"></script>
<script src="source-data.js"></script>
<script src="app.js"></script>
</body>
</html>
